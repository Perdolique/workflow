<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Sign in</title>
  </head>
  <body>
    <main class="authShell">
      <h1>Sign in</h1>
      <form>
        <label>Email <input type="email" autocomplete="email" required></label>
        <label>Password <input type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
