<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Welcome</title>
    <style>
      :root { --surface: #fff; --text: #171717; }
      * { box-sizing: border-box; }
      body { margin: 0; color: var(--text); background: var(--surface); }
      .authShell { inline-size: min(100% - 2rem, 24rem); margin-inline: auto; }
      h1, p { margin: 0; }
    </style>
  </head>
  <body>
    <main class="authShell">
      <p>Metsik access for modern teams</p>
      <h1>Welcome back</h1>
      <div aria-hidden="true">✨</div>
      <form>
        <label>Email <input type="email" required></label>
        <button type="submit">Continue</button>
      </form>
    </main>
  </body>
</html>
