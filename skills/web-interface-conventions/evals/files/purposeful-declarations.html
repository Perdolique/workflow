<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Card</title>
    <style>
      :root { --text: #171717; }
      h1 { margin: 0; }
      .card { display: block; min-width: 0; color: red; color: var(--text); }
      .card h1 { margin: 0; }
      .card:hover { min-width: 0; }
    </style>
  </head>
  <body><main><article class="card"><h1>Card title</h1></article></main></body>
</html>
