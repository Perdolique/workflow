<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Create account</title>
    <style>
      input:invalid { border-color: red; }
    </style>
  </head>
  <body>
    <main>
      <h1>Create account</h1>
      <form>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required aria-invalid="false">
        <p id="serverError" role="alert" hidden>This password was found in a data breach.</p>
        <button type="submit">Create account</button>
      </form>
    </main>
  </body>
</html>
