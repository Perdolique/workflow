name: Checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Set up Node.js and pnpm
        uses: example-maintainer/automations/.github/actions/setup-pnpm@1111111111111111111111111111111111111111
        with:
          install-dependencies: 'true'

      - name: Check
        run: pnpm check
