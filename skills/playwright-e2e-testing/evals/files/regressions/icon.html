<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Password icon</title>
    <style>
      button { inline-size: 2.75rem; block-size: 2.75rem; }
      svg { inline-size: 1.25rem; block-size: 1.25rem; }
    </style>
  </head>
  <body>
    <button type="button" aria-label="Show password">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Zm10 3a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></svg>
    </button>
    <script>
      const button = document.querySelector('button')
      const icon = button.querySelector('svg')
      button.addEventListener('click', () => {
        button.ariaLabel = 'Hide password'
        icon.innerHTML = '<path d="M3 3l18 18M2 12s4-7 10-7c2.2 0 4.1.9 5.7 2M22 12s-4 7-10 7c-2.2 0-4.1-.9-5.7-2"/>'
      })
    </script>
  </body>
</html>
