<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><title>Search</title></head>
  <body>
    <label for="query">Search</label>
    <input id="query" type="search">
    <button id="retry" type="button">Retry</button>
    <p id="status">Ready</p>
    <ul id="results"><li>Existing result</li></ul>
    <script>
      const query = document.querySelector('#query')
      const retry = document.querySelector('#retry')
      const status = document.querySelector('#status')
      const results = document.querySelector('#results')

      async function runSearch() {
        const loadingTimer = setTimeout(() => { status.textContent = 'Searching…' }, 200)
        const nextResults = await window.searchCatalog(query.value)
        clearTimeout(loadingTimer)
        results.innerHTML = nextResults.map(result => `<li>${result}</li>`).join('')
        status.textContent = 'Complete'
      }

      query.addEventListener('change', runSearch)
      retry.addEventListener('click', async () => {
        await runSearch()
        retry.focus()
      })
    </script>
  </body>
</html>
